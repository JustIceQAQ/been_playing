[project]
name = "been_playing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofile==3.12.3",
    "aiofiles>=25.1.0",
    "aiolimiter==1.2.1",
    "anyio>=4.14.2",
    "bs4==0.0.2",
    "cloudinary>=1.45.0",
    "croniter==6.2.4",
    "cssutils==2.15.0",
    "dill==0.4.1",
    "diskcache==5.6.3",
    "fake-useragent==2.2.0",
    "feedgen>=1.0.0",
    "h11>=0.16.0",
    "html5lib==1.1",
    "icalendar>=7.2.2",
    "niquests>=3.21.0",
    "orjson>=3.11.9,<4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "retry==0.9.2",
    "rich>=15.0.0",
    "selectolax>=0.4.11",
    "sentry-sdk==2.66.1",
    "urllib3>=2.7.0",
    "pillow>=12.3.0",
    "wreq>=0.12.1",
    "httpx2>=2.9.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "faker==40.36.0",
    "click==8.4.2",
    "pre-commit==4.6.1",
    "cookiecutter>=2.6.0",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.11.1",
    "folium>=0.20.0",
    "branca>=0.8.2",
    "skylos>=4.33.1",
    "pandas-stubs>=3.0.5.260730",
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "E402",
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
