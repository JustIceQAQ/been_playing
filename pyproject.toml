[project]
name = "been_playing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofile==3.12.3",
    "aiofiles>=25.1.0",
    "aiolimiter==1.3.0",
    "anyio>=4.15.1",
    "bs4==0.0.2",
    "cloudinary>=1.46.3",
    "croniter==6.2.4",
    "cssutils==2.15.0",
    "dill==0.4.1",
    "diskcache==5.6.3",
    "fake-useragent==2.2.0",
    "feedgen>=1.0.0",
    "h11>=0.16.0",
    "html5lib==1.1",
    "icalendar>=7.3.0",
    "niquests>=3.21.2",
    "orjson>=3.13.0,<4",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dateutil==3.0.0",
    "python-dotenv==1.2.4",
    "retry==0.9.2",
    "rich>=15.0.0",
    "selectolax>=1.0.2",
    "sentry-sdk==2.73.0",
    "urllib3>=2.8.0",
    "pillow>=13.0.0",
    "wreq>=0.13.0",
    "httpx2>=2.16.0",
    "certifi>=2026.10.19",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "faker==40.43.0",
    "click==8.5.0",
    "pre-commit==4.7.0",
    "cookiecutter>=2.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
    "folium>=0.20.0",
    "branca>=0.8.2",
    "skylos>=5.0.0",
    "pandas-stubs>=3.0.5.260914",
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "E402",
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
