[project]
name = "been_playing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofile==3.9.0",
    "aiofiles>=25.1.0",
    "aiolimiter==1.2.1",
    "anyio>=4.4.0",
    "bs4==0.0.2",
    "cloudinary>=1.44.2",
    "croniter==6.2.2",
    "cssutils==2.15.0",
    "dill==0.4.1",
    "diskcache==5.6.3",
    "fake-useragent==2.2.0",
    "feedgen>=1.0.0",
    "h11>=0.16.0",
    "html5lib==1.1",
    "httpx>=0.28.1",
    "httpxyz>=0.31.1",
    "icalendar>=7.1.0",
    "niquests>=3.18.7",
    "orjson>=3.11.8,<4",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "retry==0.9.2",
    "rich>=14.3.2",
    "selectolax>=0.4.7",
    "sentry-sdk==2.58.0",
    "urllib3>=2.5.0",
    "wreq>=0.11.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-xdist==3.8.0",
    "faker==40.15.0",
    "click==8.3.3",
    "pre-commit==4.6.0",
    "cookiecutter>=2.6.0",
    "numpy>=2.4.2",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.9",
    "folium>=0.20.0",
    "branca>=0.8.2",
    "skylos>=4.10.0",
]


[tool.ruff]
line-length = 120
lint.ignore = [
  "COM812", # conflicts with formatter
  "CPY",    # no copyright
  "D",      # pydocstyle: enable later for public APIs if publishing a library
  "ISC001", # conflicts with formatter
]
exclude = [".tox", ".git", "*/migrations/*", "*/static/CACHE/*", "docs", "node_modules", "venv"]

[tool.ty.rules]
too-many-positional-arguments = "ignore"
