exclude: "docs|node_modules|migrations|.git|.tox|chart|data|^template/"
default_stages: [ pre-commit ]
fail_fast: true

default_language_version:
  python: python3.12
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: check-xml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.1.2
    hooks:
      - id: ruff
        args:
          - --fix
      - id: ruff-format

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.4.2
    hooks:
      - id: prettier
        types_or: [ javascript, css, html, scss ]

  - repo: local
    hooks:
    - id: ty
      name: ty check
      entry: uvx ty check  --ignore unresolved-import
      language: python
      types: [python]
      exclude: ^(template/|\.venv/|stdlib/)
  - repo: local
    hooks:
      - id: uv-sync-post-merge
        name: UV Sync (Post-Merge)
        # 用 bash 執行：比對前一次跟現在的 commit，如果有動到 uv.lock 或 pyproject.toml 則執行 uv sync
        entry: bash -c 'git diff ORIG_HEAD HEAD --stat | grep -E "uv.lock|pyproject.toml" && uv sync || echo "依賴檔案無變更，跳過 uv sync。"'
        language: system
        stages: [post-merge]
        pass_filenames: false
        # 關鍵：強制每次 pull 觸發時都必須執行此 hook，不要讓 pre-commit 用內建的 files 機制去濾
        always_run: true
