<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="robots" content="noindex,nofollow"/>
    <meta name="referrer" content="no-referrer"/>

    <title>Map</title>
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
    />

    <style>
        #map {
            height: 85vh;
            width: 85vw;
        }
    </style>
</head>
<body>

<div style="display: flex;justify-content: center;align-items: center;">
    <div id="map"></div>
</div>


</body>
</html>
<script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
></script>

<script>
    fetch("https://raw.githubusercontent.com/JustIceQAQ/been_playing/refs/heads/auto/data-update/data/v2/_ALL_LOCATION.json")
        .then(res => res.json())
        .then(data => {
            renderMap(data)
        });

    const renderMap = (loadData) => {
        let map = L.map("map").setView([23.773, 120.959], 8);
        L.control
            .scale({
                position: "bottomleft",
            })
            .addTo(map);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution:
                '<a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        }).addTo(map);
        loadData.map((item) => {
            let this_pin = L.marker([item.latitude, item.longitude]);

            this_pin.bindPopup(
                `<a href="${item.external_link}" target="_blank">${item.fullname}</a> <br> (${item.latitude}, ${item.longitude}) <br> ${item.venue_type}`,
            );
            this_pin.addTo(map);
        });
    }


</script>
