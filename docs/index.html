  <script>
    document.addEventListener("DOMContentLoaded", async () => {
    dayjs.extend(window.dayjs_plugin_relativeTime);
    dayjs.extend(window.dayjs_plugin_timezone);
    dayjs.locale("zh-tw");
    dayjs.Ls["zh-tw"].relativeTime.future = "%s後";

    const LOCALTZ = dayjs.tz.guess();

    const formatDate = (dateString) => {
      const date = dayjs(dateString);
      return `${date.fromNow()} (${date.format("YYYY-MM-DD HH:mm:ss")})`;
    };

    const exhibitionStats = (dateString, tag = "h2", textOnly = false, countdownOnly = false) => {
      const r = (badge, label) => textOnly ? label : badge;
      if (dateString == null) return r(unableBadges(tag), "無法判斷");
      let nowDate = dayjs().startOf("day");
      let splitDateString = dateString.split("~");
      if (splitDateString.length === 1 && (splitDateString[0] === "-" || splitDateString[0] === "")) {
        return r(inProgressBadges(tag, null, countdownOnly), "進行中");
      }
      if (splitDateString.length === 1) {
        let oneDate = dayjs(splitDateString[0].trim());
        if (isNaN(oneDate)) return r(unableBadges(tag), "無法判斷");
        if (nowDate.isAfter(oneDate)) return r(finishedBadges(tag), "已經結束");
        if (oneDate.isAfter(nowDate)) return r(notStartedBadges(tag, oneDate, countdownOnly), "尚未開始");
        return r(unableBadges(tag), "無法判斷");
      } else if (splitDateString.length === 2) {
        if (splitDateString[1] === "") return r(inProgressBadges(tag, null, countdownOnly), "進行中");
        let startDate = dayjs(splitDateString[0].trim());
        let endDate = dayjs(splitDateString[1].trim());
        if (startDate.isAfter(nowDate)) return r(notStartedBadges(tag, startDate, countdownOnly), "尚未開始");
        if (nowDate.isAfter(endDate)) return r(finishedBadges(tag), "已經結束");
        return r(inProgressBadges(tag, endDate.endOf("day"), countdownOnly), "進行中");
      }
      return r(unableBadges(tag), "無法判斷");
    };

    const setLight = () => {
      document.documentElement.setAttribute("data-bs-theme", "light");
      document.getElementById("themeIcon").setAttribute("data-icon", "ph:sun-bold");
    };
    const setDark = () => {
      document.documentElement.setAttribute("data-bs-theme", "dark");
      document.getElementById("themeIcon").setAttribute("data-icon", "ph:moon-stars-bold");
    };
    document.getElementById("btnSwitch").addEventListener("click", () => {
      const runThemeSet = document.documentElement.getAttribute("data-bs-theme") === "dark" ? setLight : setDark;
      runThemeSet();
    });

    // === localStorage 快取（取代 jQuery jalc） ===
    const fetchWithCache = async (url, ttlHours = 0.5) => {
      const cacheKey = `bbp_cache_${url}`;
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem(cacheKey)); } catch {}
      if (cached && (Date.now() - cached.ts) < ttlHours * 3600 * 1000) return cached.data;
      const resp = await fetch(url);
      const data = await resp.json();
      try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data })); } catch {}
      return data;
    };

    // === 全域狀態 ===
    let currentVenueData = null;
    let currentVenueMeta = null;
    let currentStatusFilter = "";
    let currentPage = 1;
    const PAGE_SIZE = 12;

    // === 場館資訊卡 ===
    const updateInfoCard = (data) => {
      const infoCard = document.getElementById("exhibition-info-card");
      const infoHeader = document.getElementById("exhibition-info-header");
      const infoBody = document.getElementById("exhibition-info-body");
      const infoFooter = document.getElementById("exhibition-info-footer");
      if (!data?.information) return;
      const info = data.information;
      const { code_name, fullname, external_link, branch_coordinates, has_rss, has_ics } = info;
      const last_update = data.last_update;
      let googleMapPlaceId = null;
      if (branch_coordinates !== null && !Array.isArray(branch_coordinates) && typeof branch_coordinates === "object") {
        googleMapPlaceId = branch_coordinates.google_map_place_id;
      } else if (Array.isArray(branch_coordinates)) {
        googleMapPlaceId = branch_coordinates[0]?.google_map_place_id;
      }
      const btns = [];
      if (external_link) btns.push(`<a class="btn btn-secondary btn-sm" href="${external_link}" target="_blank" rel="noopener noreferrer" aria-label="前往官網"><i class="bi bi-box-arrow-up-right"></i></a>`);
      if (googleMapPlaceId) btns.push(`<a class="btn btn-secondary btn-sm" href="https://www.google.com/maps/search/?api=1&query=${fullname}&query_place_id=${googleMapPlaceId}" target="_blank" rel="noopener noreferrer" aria-label="查看地圖"><i class="bi bi-pin-map"></i></a>`);
      btns.push(`<button class="btn btn-secondary btn-sm" onclick="copyUrlToClipboard('${window.location.origin}${window.location.pathname}?topic=${code_name}')" aria-label="分享連結"><i class="bi bi-share"></i></button>`);
      if (has_rss !== false) btns.push(`<a class="btn btn-secondary btn-sm" href="${SOURCE_ROOT_URL}rss/${code_name}.xml" target="_blank" rel="noopener noreferrer" aria-label="RSS 訂閱"><i class="bi bi-rss-fill"></i></a>`);
      if (has_ics !== false) {
        const rawUrl = `${SOURCE_ROOT_URL}ics/${code_name}.ics`;
        const webCal = rawUrl.replace("https://", "webcal://");
        const gCal = `https://www.google.com/calendar/render?cid=${webCal}`;
        btns.push(`<div class="btn-group"><button class="btn btn-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown"><i class="bi bi-calendar-plus"></i> 訂閱</button><ul class="dropdown-menu"><li><a class="dropdown-item" href="${webCal}" target="_blank">Apple 日曆 / Outlook</a></li><li><a class="dropdown-item" href="${gCal}" target="_blank">Google 日曆</a></li><li><hr class="dropdown-divider"></li><li><a class="dropdown-item" href="${rawUrl}" target="_blank">下載 .ics 檔案</a></li></ul></div>`);
      }
      infoHeader.innerHTML = `<div class="d-flex flex-wrap align-items-center gap-2"><span>《${fullname}》</span>${btns.join("")}</div>`;
      const s = VENUE_STYLES[code_name] ?? DEFAULT_STYLE;
      infoCard.style.backgroundColor = s.bg;
      infoCard.style.color = s.color;
      infoCard.style.borderColor = s.border ?? s.bg;
      infoCard.style.display = "";
      const opening = data.visit?.opening;
      if (opening) {
        infoBody.innerHTML = opening.replaceAll("\n", "<br>");
        infoBody.style.display = "";
      } else {
        infoBody.innerHTML = "";
        infoBody.style.display = "none";
      }
      infoFooter.textContent = `資料更新時間: ${formatDate(last_update)}`;
    };

    // === Card 渲染 ===
    const renderCard = (item) => {
      const col = document.createElement("div");
      if (item.systematics === "BUG") {
        col.className = "col-12";
        col.innerHTML = `<div class="alert alert-danger text-center fs-5">${item.title}</div>`;
        return col;
      }
      col.className = "col";
      const city = currentVenueMeta?.city ?? "";
      const statusBadge = exhibitionStats(item.date, "span", false, true);
      const cityHtml = city ? `<small class="text-muted">${city}</small><span class="text-muted mx-1">·</span>` : "";
      const imgHtml = item.figure && item.figure !== "-"
        ? `<img src="${item.figure}" class="card-img-top" loading="lazy" alt="${item.title}" width="400" height="225">`
        : `<div class="card-img-top bg-secondary-subtle d-flex align-items-center justify-content-center" style="height:200px"><span class="text-muted">無圖片</span></div>`;
      const addrHtml = item.address && item.address !== "-"
        ? `<p class="card-text text-muted small mb-1"><i class="bi bi-geo-alt"></i> ${item.address}</p>`
        : "";
      const tagsHtml = Array.isArray(item.tags) && item.tags.length > 0
        ? `<div class="d-flex flex-wrap gap-1 mt-1">${item.tags.map(t => `<span class="badge bg-secondary">${t}</span>`).join("")}</div>`
        : "";
      col.innerHTML = `
        <div class="card h-100 exhibition-card" data-uuid="${item.UUID}">
          <div class="position-relative">${imgHtml}</div>
          <div class="card-body pb-1">
            <div class="d-flex flex-wrap align-items-center gap-1 mb-1">${cityHtml}${statusBadge}</div>
            <h6 class="card-title mb-1"><a href="${item.source_url}" target="_blank" rel="noopener noreferrer">${item.title}</a></h6>
            <p class="card-text small fw-medium mb-1" style="color:var(--bs-warning-text-emphasis)">${item.date ?? "-"}</p>
            ${addrHtml}${tagsHtml}
          </div>
          <div class="card-footer pt-1">
            <button class="btn btn-info btn-sm btn-mark-achieved w-100" data-uuid="${item.UUID}" aria-label="標記已去過">
              <i class="bi bi-check-lg"></i> 去過了
            </button>
          </div>
        </div>`;
      return col;
    };

    // === 篩選與分頁 ===
    const getFilteredItems = () => {
      if (!currentVenueData?.items) return [];
      const visited = new Set(loadAchievements().map(a => a.uuid));
      let items = currentVenueData.items.filter(item => !visited.has(item.UUID));
      if (currentStatusFilter) {
        items = items.filter(item => exhibitionStats(item.date, "h2", true) === currentStatusFilter);
      }
      return items;
    };

    const renderPagination = (totalPages, container) => {
      container.innerHTML = "";
      if (totalPages <= 1) return;
      const ul = document.createElement("ul");
      ul.className = "pagination";
      const addPage = (label, page, disabled = false, active = false) => {
        const li = document.createElement("li");
        li.className = `page-item${disabled ? " disabled" : ""}${active ? " active" : ""}`;
        const btn = document.createElement("button");
        btn.className = "page-link";
        btn.innerHTML = label;
        if (!disabled && !active) {
          btn.addEventListener("click", () => {
            currentPage = page;
            renderGrid();
            document.getElementById("exhibition-info-card").scrollIntoView({ behavior: "smooth", block: "start" });
          });
        }
        li.appendChild(btn);
        ul.appendChild(li);
      };
      addPage("«", currentPage - 1, currentPage === 1);
      const range = [];
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) range.push(i);
      }
      let prev = null;
      range.forEach(p => {
        if (prev !== null && p - prev > 1) addPage("…", -1, true);
        addPage(p, p, false, p === currentPage);
        prev = p;
      });
      addPage("»", currentPage + 1, currentPage === totalPages);
      container.appendChild(ul);
    };

    const renderGrid = () => {
      const grid = document.getElementById("exhibition-grid");
      const pagination = document.getElementById("exhibition-pagination");
      const countEl = document.getElementById("exhibition-count");
      const items = getFilteredItems();
      const total = items.length;
      const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      const pageItems = items.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
      grid.innerHTML = "";
      if (pageItems.length === 0) {
        grid.innerHTML = `<div class="col-12 text-center py-5 text-muted">沒有符合條件的展覽</div>`;
      } else {
        pageItems.forEach(item => grid.appendChild(renderCard(item)));
      }
      if (countEl) countEl.textContent = `共 ${total} 筆`;
      renderPagination(totalPages, pagination);
    };

    // === 載入場館資料 ===
    const loadVenueData = async (codeName) => {
      const loading = document.getElementById("exhibition-loading");
      const grid = document.getElementById("exhibition-grid");
      if (loading) loading.style.display = "";
      if (grid) grid.innerHTML = "";
      currentPage = 1;
      try {
        const data = await fetchWithCache(`${URL_SOURCE}${codeName}.json`);
        currentVenueData = data;
        updateInfoCard(data);
        renderGrid();
      } catch (e) {
        console.error(e)
        if (grid) grid.innerHTML = `<div class="col-12 text-center py-5 text-danger">載入失敗，請稍後再試</div>`;
      } finally {
        if (loading) loading.style.display = "none";
      }
    };

    // === 事件委派 ===
    document.getElementById("exhibition-grid").addEventListener("click", (e) => {
      const btn = e.target.closest(".btn-mark-achieved");
      if (!btn) return;
      const uuid = btn.dataset.uuid;
      const item = currentVenueData?.items?.find(i => i.UUID === uuid);
      if (item) {
        addToAchievement(item.title, item.figure, item.UUID);
        renderGrid();
      }
    });

    document.getElementById("statusSelect").addEventListener("change", function () {
      currentStatusFilter = this.value;
      currentPage = 1;
      renderGrid();
    });

    // === 場館選擇器建構 ===
    const buildVenueSelector = (allVenues, allTopicSet, metaByTopic, initTopic) => {
      const btnsByCityType = {};
      const platformVenues = [];

      allVenues.forEach(v => {
        if (v.city === null) {
          platformVenues.push(v);
        } else {
          const typeKey = v.venue_type ?? "other";
          if (!btnsByCityType[v.city]) btnsByCityType[v.city] = {};
          if (!btnsByCityType[v.city][typeKey]) btnsByCityType[v.city][typeKey] = [];
          btnsByCityType[v.city][typeKey].push(v);
        }
      });

      const wrapperMap = {};
      allVenues.forEach(v => {
        const wrapper = document.createElement("div");
        wrapper.className = "btn-group";
        wrapper.dataset.topic = v.code_name;
        wrapper.dataset.city = v.city || "";
        wrapper.dataset.typeKey = v.venue_type ?? "other";

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `btn btn-${v.code_name}`;
        btn.textContent = v.fullname;
        btn.addEventListener("click", async () => {
          currentVenueMeta = v;
          currentStatusFilter = "";
          document.getElementById("statusSelect").value = "";
          await loadVenueData(v.code_name);
        });
        wrapper.appendChild(btn);

        const watched = isVenueWatched(v.code_name);
        const watchBtn = document.createElement("button");
        watchBtn.type = "button";
        watchBtn.className = `btn ${watched ? "btn-warning" : "btn-outline-secondary"}`;
        watchBtn.innerHTML = `<i class="bi ${watched ? "bi-bell-fill" : "bi-bell"}"></i>`;
        watchBtn.title = watched ? "取消關注" : "加入關注";
        watchBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const nowWatched = toggleVenueWatch(v.code_name);
          watchBtn.className = `btn ${nowWatched ? "btn-warning" : "btn-outline-secondary"}`;
          watchBtn.innerHTML = `<i class="bi ${nowWatched ? "bi-bell-fill" : "bi-bell"}"></i>`;
          watchBtn.title = nowWatched ? "取消關注" : "加入關注";
          if (activeCity === "關注清單") renderContent();
        });
        wrapper.appendChild(watchBtn);
        wrapperMap[v.code_name] = wrapper;
      });

      const allCityWrappers = () =>
        Object.values(btnsByCityType).flatMap(t => Object.values(t).flat().map(v => wrapperMap[v.code_name]));
      const getCityWrappers = (city) =>
        Object.values(btnsByCityType[city] || {}).flat().map(v => wrapperMap[v.code_name]);

      let activeCity = "全台";
      let activeType = "all";

      const tabsContainer = document.createElement("div");
      tabsContainer.className = "venue-selector";
      const cityNav = document.createElement("ul");
      cityNav.className = "nav nav-tabs flex-wrap venue-selector-nav";
      const typeFilter = document.createElement("div");
      typeFilter.className = "venue-selector-type-filter";
      typeFilter.style.display = "none";
      const filterInput = document.createElement("input");
      filterInput.type = "text";
      filterInput.placeholder = "搜尋場館...";
      filterInput.className = "form-control";
      filterInput.style.cssText = "border-radius:0; border-left:0; border-right:0;";
      const content = document.createElement("div");
      content.className = "venue-selector-content";

      const renderTypeFilter = () => {
        typeFilter.innerHTML = "";
        if (activeCity === "關注清單" || activeCity === "🎫 票務平台") {
          typeFilter.style.display = "none";
          return;
        }
        const pool = activeCity === "全台" ? allCityWrappers() : getCityWrappers(activeCity);
        const byType = pool.reduce((acc, w) => {
          const t = w.dataset.typeKey;
          (acc[t] = acc[t] || []).push(w);
          return acc;
        }, {});
        if (Object.keys(byType).length <= 1) { typeFilter.style.display = "none"; return; }
        typeFilter.style.display = "";
        const mkPill = (key, label, count) => {
          const pill = document.createElement("button");
          pill.className = `btn ${activeType === key ? "btn-primary" : "btn-outline-secondary"}`;
          pill.innerHTML = count != null ? `${label} <span class="badge bg-secondary ms-1">${count}</span>` : label;
          pill.addEventListener("click", () => { activeType = key; renderTypeFilter(); renderContent(); });
          return pill;
        };
        const sortedTypes = Object.keys(byType).sort((a, b) => {
          const ia = venueTypeOrder.indexOf(a), ib = venueTypeOrder.indexOf(b);
          return (ia === -1 ? Infinity : ia) - (ib === -1 ? Infinity : ib);
        });
        sortedTypes.forEach(k => typeFilter.appendChild(mkPill(k, venueTypeDisplayMap[k] || k, byType[k].length)));
        typeFilter.appendChild(mkPill("all", "全部類型", pool.length));
        typeFilter.classList.remove("bbp-animate");
        void typeFilter.offsetWidth;
        typeFilter.classList.add("bbp-animate");
      };

      const renderContent = (searchQuery = "") => {
        const fromH = content.offsetHeight;
        content.innerHTML = "";
        let wrappers = [];
        if (searchQuery) {
          wrappers = [...allCityWrappers(), ...platformVenues.map(v => wrapperMap[v.code_name])]
            .filter(w => w.textContent.toLowerCase().includes(searchQuery));
        } else if (activeCity === "關注清單") {
          wrappers = [...allCityWrappers(), ...platformVenues.map(v => wrapperMap[v.code_name])]
            .filter(w => isVenueWatched(w.dataset.topic));
        } else if (activeCity === "🎫 票務平台") {
          wrappers = platformVenues.map(v => wrapperMap[v.code_name]);
        } else {
          const pool = activeCity === "全台" ? allCityWrappers() : getCityWrappers(activeCity);
          wrappers = activeType === "all" ? pool : pool.filter(w => w.dataset.typeKey === activeType);
        }
        if (activeCity === "關注清單" && wrappers.length === 0) {
          const empty = document.createElement("p");
          empty.className = "text-muted m-2";
          empty.textContent = "尚未關注任何場館，點擊場館旁的 🔔 即可加入關注";
          content.appendChild(empty);
        } else {
          wrappers.forEach(w => content.appendChild(w));
        }
        const toH = content.offsetHeight;
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && Math.abs(toH - fromH) > 4) {
          content.style.overflow = "hidden";
          content.animate(
            [{ height: `${fromH}px` }, { height: `${toH}px` }],
            { duration: 260, easing: "ease-in-out" }
          ).onfinish = () => { content.style.overflow = ""; };
        }
        content.classList.remove("bbp-animate");
        void content.offsetWidth;
        content.classList.add("bbp-animate");
      };

      const selectCity = (cityName) => {
        activeCity = cityName;
        if (cityName === "關注清單" || cityName === "🎫 票務平台" || cityName === "全台") {
          activeType = "all";
        } else {
          const pool = getCityWrappers(cityName);
          const byType = pool.reduce((acc, w) => {
            (acc[w.dataset.typeKey] = acc[w.dataset.typeKey] || []).push(w);
            return acc;
          }, {});
          activeType = venueTypeOrder.find(t => byType[t]) || "all";
        }
        cityNav.querySelectorAll(".nav-link").forEach(l =>
          l.classList.toggle("active", l.dataset.city === cityName)
        );
        renderTypeFilter();
        renderContent();
      };

      const addCityTab = (cityKey, label) => {
        const li = document.createElement("li");
        li.className = "nav-item";
        const btn = document.createElement("button");
        btn.className = "nav-link";
        btn.dataset.city = cityKey;
        btn.innerHTML = label;
        btn.addEventListener("click", () => selectCity(cityKey));
        li.appendChild(btn);
        cityNav.appendChild(li);
      };

      addCityTab("關注清單", '<i class="bi bi-bell-fill"></i> 關注清單');
      const knownCities = cityDisplayOrder.filter(c => btnsByCityType[c]);
      const extraCities = Object.keys(btnsByCityType).filter(c => !cityDisplayOrder.includes(c));
      [...knownCities, ...extraCities].forEach(city => {
        const total = Object.values(btnsByCityType[city]).flat().length;
        addCityTab(city, `${city} <span class="badge bg-secondary ms-1">${total}</span>`);
      });
      if (platformVenues.length > 0)
        addCityTab("🎫 票務平台", `🎫 票務平台 <span class="badge bg-secondary ms-1">${platformVenues.length}</span>`);
      addCityTab("全台", "📍 全台");

      filterInput.addEventListener("input", function () {
        const query = this.value.toLowerCase();
        if (query) {
          cityNav.style.pointerEvents = "none";
          cityNav.style.opacity = "0.4";
          typeFilter.style.display = "none";
        } else {
          cityNav.style.pointerEvents = "";
          cityNav.style.opacity = "";
          renderTypeFilter();
        }
        renderContent(query);
      });

      tabsContainer.appendChild(cityNav);
      tabsContainer.appendChild(typeFilter);
      tabsContainer.appendChild(filterInput);
      tabsContainer.appendChild(content);

      const mainCol = document.querySelector("main .col");
      if (mainCol) mainCol.insertBefore(tabsContainer, mainCol.firstChild);

      const urlTopicParam = new URLSearchParams(window.location.search).get("topic");
      const hasWatchlist = loadVenueWatchlist().some(t => allTopicSet.has(t));
      if (urlTopicParam) {
        const initMeta = metaByTopic[initTopic];
        const initCity = initMeta ? (initMeta.city === null ? "🎫 票務平台" : initMeta.city) : "全台";
        selectCity(initCity);
      } else if (hasWatchlist) {
        selectCity("關注清單");
      } else {
        selectCity("臺北市");
        const pool = getCityWrappers("臺北市");
        const byType = pool.reduce((acc, w) => { (acc[w.dataset.typeKey] = acc[w.dataset.typeKey] || []).push(w); return acc; }, {});
        const firstType = venueTypeOrder.find(t => byType[t]);
        if (firstType) {
          activeType = firstType;
          renderTypeFilter();
          renderContent();
        }
      }
    };

    // === 初始化 ===
    (async () => {
      const isDark = window.matchMedia("(prefers-color-scheme:dark)").matches;
      (isDark ? setDark : setLight)();

      let venueMetaList = [];
      try {
        const resp = await fetch(`${URL_SOURCE}_VENUE_META.json`);
        venueMetaList = await resp.json();
      } catch (e) {}

      const metaByTopic = Object.fromEntries(venueMetaList.map(v => [v.code_name, v]));
      const allVenues = venueMetaList.map(v => {
        const s = VENUE_STYLES[v.code_name] ?? DEFAULT_STYLE;
        return { ...v, color: s.color, bg: s.bg, border: s.border ?? s.bg };
      });
      const allTopicSet = new Set(allVenues.map(v => v.code_name));

      const venueStyleEl = document.createElement("style");
      venueStyleEl.innerHTML = allVenues.map(v =>
        `.btn-${v.code_name}{color:${v.color};background-color:${v.bg};border-color:${v.border};` +
        `--bs-btn-hover-color:${v.color};--bs-btn-hover-bg:${v.bg};}`
      ).join("");
      document.head.appendChild(venueStyleEl);

      const urlTopic = new URLSearchParams(window.location.search).get("topic");
      const firstWatched = loadVenueWatchlist().find(t => allTopicSet.has(t));
      const firstTaipeiMuseum = allVenues.find(v => v.city === "臺北市" && v.venue_type === "museum");
      const initTopic = (urlTopic && allTopicSet.has(urlTopic)) ? urlTopic : firstWatched ?? firstTaipeiMuseum?.code_name ?? allVenues[0]?.code_name;

      buildVenueSelector(allVenues, allTopicSet, metaByTopic, initTopic);

      if (initTopic) {
        currentVenueMeta = metaByTopic[initTopic];
        await loadVenueData(initTopic);
      }
    })();

      const achievements = loadAchievements();
      achievements.forEach(item => addToAchievement(item.title, item.figure, item.uuid, false));
    });
  </script>
</html>
