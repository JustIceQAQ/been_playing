  <script>
    dayjs.extend(window.dayjs_plugin_relativeTime);
    dayjs.extend(window.dayjs_plugin_timezone);
    const finishedAfter5Day = (dateString) => {
      let nowDate = dayjs(new Date().toLocaleDateString("tw-zh"));
      let splitDateString = dateString.split("~");
      if (splitDateString.length === 1) {
        let oneDate = dayjs(splitDateString[0].trim());
        if (nowDate.isAfter(oneDate.add(5, "days"))) {
          return true;
        }
      } else if (splitDateString.length === 2) {
        let endDate = dayjs(splitDateString[1].trim());
        if (nowDate.isAfter(endDate.add(5, "days"))) {
          return true;
        }
      }
      return false;
    };

    const exhibitionStats = (dateString, tag = "h2") => {
      if (dateString == null) {
        return unableBadges(tag);
      }

      let nowDate = dayjs(new Date().toLocaleDateString("tw-zh"));
      let splitDateString = dateString.split("~");

      if (
        splitDateString.length === 1 &&
        (splitDateString[0] === "-" || splitDateString[0] === "")
      ) {
        return inProgressBadges(tag);
      }

      if (splitDateString.length === 1) {
        let oneDate = dayjs(splitDateString[0].trim());
        if (isNaN(oneDate)) {
          return unableBadges(tag);
        }
        if (nowDate.isAfter(oneDate)) {
          return finishedBadges(tag);
        }
        if (oneDate.isAfter(nowDate)) {
          return notStartedBadges(tag);
        }

        return unableBadges(tag);
      } else if (splitDateString.length === 2) {
        if (splitDateString[1] === "") {
          return inProgressBadges(tag);
        } else {
          let startDate = dayjs(splitDateString[0].trim());
          let endDate = dayjs(splitDateString[1].trim());
          if (startDate.isAfter(nowDate)) {
            return notStartedBadges(tag);
          }
          if (nowDate.isAfter(endDate)) {
            return finishedBadges(tag);
          }
          return inProgressBadges(tag);
        }
      }
      return unableBadges(tag);
    };

    const setLight = () => {
      document.documentElement.setAttribute("data-bs-theme", "light");
      document.getElementById("themeIcon").setAttribute("data-icon", "ph:sun-bold");
    };
    const setDark = () => {
      document.documentElement.setAttribute("data-bs-theme", "dark");
      document.getElementById("themeIcon").setAttribute("data-icon", "ph:moon-stars-bold");
    };
    document.getElementById("btnSwitch").addEventListener("click", () => {
      let runThemeSet =
        document.documentElement.getAttribute("data-bs-theme") == "dark"
          ? setLight
          : setDark;
      runThemeSet();
    });
    dayjs.locale("zh-tw");

    $(document).ready(async function () {
      const isDark = window.matchMedia("(prefers-color-scheme:dark)").matches;
      const runThemeSet = isDark ? setDark : setLight;
      const initTopic = getInitTopic();

      // 預載場館 metadata，失敗時優雅降級
      let venueMetaList = [];
      try {
        const resp = await fetch(`${URL_SOURCE}_VENUE_META.json`);
        venueMetaList = await resp.json();
      } catch (e) {}
      const metaByTopic = Object.fromEntries(venueMetaList.map((v) => [v.code_name, v]));

      let initUrl = `${URL_SOURCE}${initTopic}.json`;
      runThemeSet();
      $("#exhibition").DataTable({
        dom: "Brtip",
        processing: true,
        deferRender: true,
        ajax: {
          url: initUrl,
          localCache: true,
          type: "GET",
          cacheTTL: 0.5,
          dataSrc: function (d) {
            const visited = loadAchievements();
            const visitedUUIDs = new Set(visited.map((item) => item.uuid));
            return d.items.filter((item) => !visitedUUIDs.has(item.UUID));

            // return d.items
          },
        },
        order: [],
        columns: [
          {
            data: "title",
            createdCell: (td) => td.setAttribute("data-label", "展覽"),
            render: function (data, type, row) {
              return `<a target="_blank" href="${row.source_url}"><div style="white-space:normal;word-break:break-all;">${data}${exhibitionStats(row.date, (tag = "h6"))}</div></a>`;
            },
          },
          {
            data: "figure",
            createdCell: (td) => td.setAttribute("data-label", "圖片"),
            render: function (data, type, row) {
              if (data === "-") {
                return "-";
              }
              return '<img src="' + data + '" loading="lazy" />';
            },
          },
          {
            data: "date",
            createdCell: (td) => td.setAttribute("data-label", "日期"),
          },
          {
            data: "address",
            createdCell: (td) => td.setAttribute("data-label", "地點"),
            render: function (data, type, row) {
              if (data == null) {
                return `<div style="white-space:normal;word-break:break-all;">-</div>`;
              }
              return `<div style="white-space:normal;word-break:break-all;">${data}</div>`;
            },
          },
          {
            data: "date",
            createdCell: (td) => td.setAttribute("data-label", "狀態"),
            render: function (data, type, row) {
              return exhibitionStats(data);
            },
          },
          {
            data: "UUID",
            createdCell: (td) => td.setAttribute("data-label", ""),
            render: function (data, type, row, meta) {
              return `<button class="btn btn-info btn-mark-achieved" data-uuid="${data}"><i class="bi bi-check-lg"></i></button>`;
            },
          },
        ],
        buttons: customizeButtons,
        drawCallback: function (exhibition) {
          if (exhibition.json !== undefined) {
            let exhibitionInformation = exhibition.json["information"];
            let codeName = exhibitionInformation["code_name"];
            let last_update = exhibition.json["last_update"];
            let informationFullName = exhibitionInformation["fullname"];
            let externalLink = exhibitionInformation["external_link"];
            let coordinate = exhibitionInformation["branch_coordinates"];

            let hasRSS = exhibitionInformation["has_rss"];
            let hasIcs = exhibitionInformation["has_ics"];
            let googleMapPlaceId = null;
            if (coordinate !== null && typeof coordinate === "object") {
              googleMapPlaceId = coordinate["google_map_place_id"];
            } else if (coordinate !== null && Array.isArray(coordinate)) {
              googleMapPlaceId = coordinate[0]["google_map_place_id"];
            }

            let btns = [];
            if (externalLink !== undefined) {
              btns.push(`<a class="btn btn-secondary" href="${externalLink}" target="_blank"><i class="bi bi-box-arrow-up-right"></i></a>`);
            }
            if (googleMapPlaceId !== null) {
              btns.push(`<a class="btn btn-secondary" href="https://www.google.com/maps/search/?api=1&query=${informationFullName}&query_place_id=${googleMapPlaceId}" target="_blank"><i class="bi bi-pin-map"></i></a>`);
            }
            btns.push(`<a class="btn btn-secondary" onclick="copyUrlToClipboard('${window.location.origin}${window.location.pathname}?topic=${exhibitionInformation["code_name"]}')" target="_blank"><i class="bi bi-share"></i></a>`);

            if (hasRSS !== false) {
              btns.push(`<a class="btn btn-secondary" href="${SOURCE_ROOT_URL}rss/${codeName}.xml" target="_blank"><i class="bi bi-rss-fill"></i></a>`);
            }

            if (hasIcs !== false) {
              let rawHttpsIcsUrl = `${SOURCE_ROOT_URL}ics/${codeName}.ics`;
              let webCalIcsUrl = rawHttpsIcsUrl.replace('https://', 'webcal://');
              let googleIcsUrl = `https://www.google.com/calendar/render?cid=${webCalIcsUrl}`;
              btns.push(`<div class="btn-group">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                  <i class="bi bi-calendar-plus"></i> 訂閱
                </button>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="${webCalIcsUrl}" target="_blank">Apple 日曆 / Outlook</a></li>
                  <li><a class="dropdown-item" href="${googleIcsUrl}" target="_blank">Google 日曆</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item" href="${rawHttpsIcsUrl}" target="_blank">下載 .ics 檔案</a></li>
                </ul>
              </div>`);
            }

            let opening = "";
            if (exhibition.json["visit"] !== undefined) {
              opening = exhibition.json["visit"]["opening"];
            }

            $(".caption-card-header").html(
              `<div class="d-flex flex-wrap align-items-center gap-2"><span>《${informationFullName}》</span>${btns.join("")}</div>`,
            );
            const captionCard = document.querySelector("#exhibition caption .card");
            if (captionCard) {
              const ajaxCfg = this.ajax;
              const currentUrl = (typeof ajaxCfg === "string" ? ajaxCfg : ajaxCfg?.url) || "";
              const topicFromUrl = currentUrl.match(/\/([^/]+)\.json/)?.[1];
              const btnStyle = allTopicClass.find(e => e.topic === topicFromUrl)?.buttonStyle;
              if (btnStyle) {
                captionCard.style.backgroundColor = btnStyle.backgroundColor;
                captionCard.style.color = btnStyle.color;
                captionCard.style.borderColor = btnStyle.borderColor;
              } else {
                captionCard.style.backgroundColor = "";
                captionCard.style.color = "";
                captionCard.style.borderColor = "";
              }
            }
            if (opening !== undefined && opening !== "") {
              $(".caption-card-body").html(
                `${opening.replaceAll("\n", "<br>")}`,
              );
            } else {
              $(".caption-card-body").empty();
            }
            $(".caption-card-footer").html(
              `資料更新時間: ${formatDate(last_update)}`,
            );
          }
        },
        createdRow: function (row, data, dataIndex) {
          if (data.systematics === "BUG") {
            $("td:eq(0)", row).attr("colspan", 5);
            $("td:eq(1)", row).css("display", "none");
            $("td:eq(3)", row).css("display", "none");
            $("td:eq(2)", row).css("display", "none");
            $("td:eq(4)", row).css("display", "none");
            $("td:eq(0)", row).css({
              "text-align": "center",
              "font-size": "1.5rem",
            });
            $("td:eq(0)", row).addClass("table-danger");
          }
        },
        initComplete: function () {
          this.api()
            .columns([4])
            .every(function () {
              let column = this;

              // Create select element
              let select = document.createElement("select");
              select.add(new Option("全部顯示", (value = "")));

              column.footer().replaceChildren(select);

              // Apply listener for user change in value
              select.addEventListener("change", function () {
                column.search(select.value, { exact: true }).draw();
              });

              // Add list of options
              select.className = "form-select";
              select.add(new Option("尚未開始"));
              select.add(new Option("進行中"));
              select.add(new Option("已經結束"));
              select.add(new Option("無法判斷"));
            });

          const dtButtonsDiv = document.querySelector(".dt-buttons");
          if (dtButtonsDiv) {
            const allBtns = Array.from(dtButtonsDiv.querySelectorAll("button"));

            // 依城市 + 類型分桶；平台另存
            const btnsByCityType = {}; // { city: { typeKey: [wrapper, ...] } }
            const platformWrappers = [];

            allBtns.forEach(btn => {
              const topic = Array.from(btn.classList)
                .map(c => c.replace(/^btn-/, ""))
                .find(t => allTopicSet.has(t));
              if (!topic) return;

              const meta = metaByTopic[topic];
              const city = meta?.city ?? null;
              const typeKey = meta?.venue_type ?? "other";

              const wrapper = document.createElement("div");
              wrapper.className = "btn-group";
              wrapper.dataset.topic = topic;
              wrapper.dataset.city = city || "";
              wrapper.dataset.typeKey = typeKey;
              wrapper.appendChild(btn);

              const watched = isVenueWatched(topic);
              const watchBtn = document.createElement("button");
              watchBtn.type = "button";
              watchBtn.className = `btn ${watched ? "btn-warning" : "btn-outline-secondary"}`;
              watchBtn.innerHTML = `<i class="bi ${watched ? "bi-bell-fill" : "bi-bell"}"></i>`;
              watchBtn.title = watched ? "取消關注" : "加入關注";
              watchBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                const nowWatched = toggleVenueWatch(topic);
                watchBtn.className = `btn ${nowWatched ? "btn-warning" : "btn-outline-secondary"}`;
                watchBtn.innerHTML = `<i class="bi ${nowWatched ? "bi-bell-fill" : "bi-bell"}"></i>`;
                watchBtn.title = nowWatched ? "取消關注" : "加入關注";
                if (activeCity === "關注清單") renderContent();
              });
              wrapper.appendChild(watchBtn);

              if (city === null) {
                platformWrappers.push(wrapper);
              } else {
                if (!btnsByCityType[city]) btnsByCityType[city] = {};
                if (!btnsByCityType[city][typeKey]) btnsByCityType[city][typeKey] = [];
                btnsByCityType[city][typeKey].push(wrapper);
              }
            });

            // 取得所有非平台 wrapper
            const allCityWrappers = () =>
              Object.values(btnsByCityType).flatMap(t => Object.values(t).flat());

            // 狀態
            let activeCity = "全台";
            let activeType = "all";

            // DOM 結構
            const tabsContainer = document.createElement("div");
            tabsContainer.className = "venue-selector";

            const cityNav = document.createElement("ul");
            cityNav.className = "nav nav-tabs flex-wrap venue-selector-nav";

            const typeFilter = document.createElement("div");
            typeFilter.className = "venue-selector-type-filter";
            typeFilter.style.display = "none";

            const filterInput = document.createElement("input");
            filterInput.type = "text";
            filterInput.placeholder = "搜尋場館...";
            filterInput.className = "form-control form-control-sm";
            filterInput.style.cssText = "border-radius:0; border-left:0; border-right:0;";

            const content = document.createElement("div");
            content.className = "venue-selector-content";

            // 渲染 venue_type 次篩選列
            const renderTypeFilter = () => {
              typeFilter.innerHTML = "";

              if (activeCity === "關注清單" || activeCity === "🎫 票務平台") {
                typeFilter.style.display = "none";
                return;
              }

              const pool = activeCity === "全台" ? allCityWrappers() : Object.values(btnsByCityType[activeCity] || {}).flat();
              const byType = pool.reduce((acc, w) => {
                const t = w.dataset.typeKey;
                (acc[t] = acc[t] || []).push(w);
                return acc;
              }, {});

              if (Object.keys(byType).length <= 1) {
                typeFilter.style.display = "none";
                return;
              }
              typeFilter.style.display = "";

              const mkPill = (key, label, count) => {
                const pill = document.createElement("button");
                pill.className = `btn btn-sm ${activeType === key ? "btn-primary" : "btn-outline-secondary"}`;
                pill.innerHTML = count != null
                  ? `${label} <span class="badge bg-secondary ms-1">${count}</span>`
                  : label;
                pill.addEventListener("click", () => {
                  activeType = key;
                  renderTypeFilter();
                  renderContent();
                });
                return pill;
              };

              typeFilter.appendChild(mkPill("all", "全部類型", pool.length));
              Object.entries(byType).forEach(([k, ws]) => {
                typeFilter.appendChild(mkPill(k, venueTypeDisplayMap[k] || k, ws.length));
              });
            };

            // 渲染場館按鈕區
            const renderContent = (searchQuery = "") => {
              content.innerHTML = "";
              let wrappers = [];

              if (searchQuery) {
                wrappers = [...allCityWrappers(), ...platformWrappers]
                  .filter(w => w.textContent.toLowerCase().includes(searchQuery));
              } else if (activeCity === "關注清單") {
                wrappers = [...allCityWrappers(), ...platformWrappers]
                  .filter(w => isVenueWatched(w.dataset.topic));
              } else if (activeCity === "🎫 票務平台") {
                wrappers = platformWrappers;
              } else {
                const pool = activeCity === "全台"
                  ? allCityWrappers()
                  : Object.values(btnsByCityType[activeCity] || {}).flat();
                wrappers = activeType === "all"
                  ? pool
                  : pool.filter(w => w.dataset.typeKey === activeType);
              }

              if (activeCity === "關注清單" && wrappers.length === 0) {
                const empty = document.createElement("p");
                empty.className = "text-muted m-2";
                empty.textContent = "尚未關注任何場館，點擊場館旁的 🔔 即可加入關注";
                content.appendChild(empty);
              } else {
                wrappers.forEach(w => content.appendChild(w));
              }
            };

            // 切換城市 tab
            const selectCity = (cityName) => {
              activeCity = cityName;
              activeType = "all";
              cityNav.querySelectorAll(".nav-link").forEach(l =>
                l.classList.toggle("active", l.dataset.city === cityName),
              );
              renderTypeFilter();
              renderContent();
            };

            // 建立城市 tab
            const addCityTab = (cityKey, label) => {
              const li = document.createElement("li");
              li.className = "nav-item";
              const btn = document.createElement("button");
              btn.className = "nav-link";
              btn.dataset.city = cityKey;
              btn.innerHTML = label;
              btn.addEventListener("click", () => selectCity(cityKey));
              li.appendChild(btn);
              cityNav.appendChild(li);
            };

            addCityTab("關注清單", '<i class="bi bi-bell-fill"></i> 關注清單');
            addCityTab("全台", "📍 全台");
            // 依 cityDisplayOrder 排列，再補上不在清單內的城市
            const knownCities = cityDisplayOrder.filter(c => btnsByCityType[c]);
            const extraCities = Object.keys(btnsByCityType).filter(c => !cityDisplayOrder.includes(c));
            [...knownCities, ...extraCities].forEach(city => {
              const total = Object.values(btnsByCityType[city]).flat().length;
              addCityTab(city, `${city} <span class="badge bg-secondary ms-1">${total}</span>`);
            });
            if (platformWrappers.length > 0)
              addCityTab("🎫 票務平台", `🎫 票務平台 <span class="badge bg-secondary ms-1">${platformWrappers.length}</span>`);

            filterInput.addEventListener("input", function () {
              const query = this.value.toLowerCase();
              if (query) {
                cityNav.style.pointerEvents = "none";
                cityNav.style.opacity = "0.4";
                typeFilter.style.display = "none";
              } else {
                cityNav.style.pointerEvents = "";
                cityNav.style.opacity = "";
                renderTypeFilter();
              }
              renderContent(query);
            });

            tabsContainer.appendChild(cityNav);
            tabsContainer.appendChild(typeFilter);
            tabsContainer.appendChild(filterInput);
            tabsContainer.appendChild(content);

            dtButtonsDiv.parentNode.insertBefore(tabsContainer, dtButtonsDiv);
            dtButtonsDiv.style.display = "none";

            // 初始 tab 選擇
            const urlTopic = new URLSearchParams(window.location.search).get("topic");
            const hasWatchlist = loadVenueWatchlist().some(t => allTopicSet.has(t));
            if (!urlTopic && hasWatchlist) {
              selectCity("關注清單");
            } else {
              const initMeta = metaByTopic[initTopic];
              const initCity = initMeta
                ? (initMeta.city === null ? "🎫 票務平台" : initMeta.city)
                : "全台";
              selectCity(initCity);
            }
          }
        },
      });
    });
     $("#exhibition").on("page.dt", function () {
      const caption = document.querySelector("#exhibition caption");
      const target = caption ?? document.getElementById("exhibition_wrapper");
      target?.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    $("#exhibition").on("click", ".btn-mark-achieved", function () {
      const uuid = $(this).data("uuid");
      const table = $("#exhibition").DataTable();
      const rowData = table
        .rows()
        .data()
        .toArray()
        .find((row) => row.UUID === uuid);

      if (rowData) {
        addToAchievement(rowData.title, rowData.figure, rowData.UUID);
        const rowIndex = table
          .rows()
          .indexes()
          .toArray()
          .find((index) => table.row(index).data().UUID === uuid);
        if (rowIndex !== undefined) {
          table.row(rowIndex).remove().draw();
        }
      }
    });
    const LOCALTZ = dayjs.tz.guess();
    const formatDate = (dateString) => {
      let date = dayjs(dateString);
      return `${date.fromNow()} (${date.format("YYYY-MM-DD HH:mm:ss")})`;
    };

    window.addEventListener("DOMContentLoaded", () => {
      const achievements = loadAchievements();
      achievements.forEach((item) => {
        addToAchievement(item.title, item.figure, item.uuid, false);
      });
    });
  </script>
