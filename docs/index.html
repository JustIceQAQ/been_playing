<script>
    dayjs.extend(window.dayjs_plugin_relativeTime);
    dayjs.extend(window.dayjs_plugin_timezone);
    const finishedAfter5Day = (dateString) => {
        let nowDate = dayjs(new Date().toLocaleDateString('tw-zh'))
        let splitDateString = dateString.split("~")
        if (splitDateString.length === 1) {
            let oneDate = dayjs(splitDateString[0].trim())
            if (nowDate.isAfter(oneDate.add(5, 'days'))) {
                return true
            }
        } else if (splitDateString.length === 2) {
            let endDate = dayjs(splitDateString[1].trim())
            if (nowDate.isAfter(endDate.add(5, 'days'))) {
                return true
            }
        }
        return false
    }

    const exhibitionStats = (dateString, tag = "h2") => {
        if (dateString == null) {
            return unableBadges(tag)
        }

        let nowDate = dayjs(new Date().toLocaleDateString('tw-zh'))
        let splitDateString = dateString.split("~")


        if (splitDateString.length === 1 && (splitDateString[0] === '-' || splitDateString[0] === '')) {
            return inProgressBadges(tag)
        }


        if (splitDateString.length === 1) {
            let oneDate = dayjs(splitDateString[0].trim())
            if (isNaN(oneDate)) {
                return unableBadges(tag)
            }
            if (nowDate.isAfter(oneDate)) {
                return finishedBadges(tag)
            }
            if (oneDate.isAfter(nowDate)) {
                return notStartedBadges(tag)
            }

            return unableBadges(tag)
        } else if (splitDateString.length === 2) {

            if (splitDateString[1] === '') {
                return inProgressBadges(tag)
            } else {
                let startDate = dayjs(splitDateString[0].trim())
                let endDate = dayjs(splitDateString[1].trim())
                if (startDate.isAfter(nowDate)) {
                    return notStartedBadges(tag)
                }
                if (nowDate.isAfter(endDate)) {
                    return finishedBadges(tag)
                }
                return inProgressBadges(tag)
            }
        }
        return unableBadges(tag)

    }


    const setLight = () => {
        changeThemeMode('dark_mode_fix.css', "light_mode_fix.css")
        document.documentElement.setAttribute('data-bs-theme', 'light')
        document.getElementById('themeIcon').setAttribute("data-icon", "ph:sun-bold");
    }
    const setDark = () => {
        changeThemeMode("light_mode_fix.css", 'dark_mode_fix.css')
        document.documentElement.setAttribute('data-bs-theme', 'dark')
        document.getElementById('themeIcon').setAttribute("data-icon", "ph:moon-stars-bold");
    }
    const changeThemeMode = (modeA, modelB) => {
        $(`link[href='${modeA}]']`).remove();
        $('head').append(`<link rel="stylesheet" type="text/css" href="${modelB}">`);
    }
    document.getElementById('btnSwitch').addEventListener('click', () => {
        let runThemeSet = (document.documentElement.getAttribute('data-bs-theme') == 'dark') ? setLight : setDark
        runThemeSet()
    })
    dayjs.locale('zh-tw');


    $(document).ready(function () {
        const isDark = window.matchMedia("(prefers-color-scheme:dark)").matches
        const runThemeSet = isDark ? setDark : setLight
        const initTopic = getInitTopic()

        let initUrl = `${URL_SOURCE}${initTopic}.json`
        runThemeSet()
        $('#exhibition').DataTable({
            dom: 'Brtip',
            processing: true,
            responsive: true,
            deferRender: true,
            ajax: {
                url: initUrl,
                localCache: true,
                type: "GET",
                cacheTTL: 0.5,
                dataSrc: function (d) {
                    const visited = loadAchievements();
                    const visitedUUIDs = new Set(visited.map(item => item.uuid));
                    return d.items.filter(item => !visitedUUIDs.has(item.UUID));

                    // return d.items
                }
            },
            order: [],
            columns: [
                {
                    data: 'title',
                    render: function (data, type, row) {
                        return `<a target="_blank" href="${row.source_url}"><div style="width:18rem;white-space:normal;word-break:break-all;">${data}${exhibitionStats(row.date, tag = "h6")}</div></a>`
                    }
                },
                {
                    data: 'figure',
                    render: function (data, type, row) {
                        if (data === "-") {
                            return "-"
                        }
                        return '<img src="' + data + '" loading="lazy" />';
                    }
                },
                {data: 'date'},
                {
                    data: 'address',
                    render: function (data, type, row) {
                        if (data == null) {
                            return `<div style="width:14rem;white-space:normal;word-break:break-all;">-</div>`
                        }
                        return `<div style="width:14rem;white-space:normal;word-break:break-all;">${data}</div>`
                    }
                },
                {
                    data: 'date',
                    render: function (data, type, row) {
                        return exhibitionStats(data)
                    }
                },
                {
                    data: 'UUID',
                    render: function (data, type, row, meta) {
                        return `<button class="btn btn-info btn-mark-achieved" data-uuid="${data}"'><i class="bi bi-check-lg"></i></button>`
                    }
                },
            ],
            columnDefs: [
                {targets: 0, responsivePriority: 1,},
                {targets: 1, responsivePriority: 10002},
                {targets: 2, responsivePriority: 1},
                {targets: 3, responsivePriority: 2},
                {targets: 4, responsivePriority: 2},
                {targets: 5, responsivePriority: 2},

            ],
            buttons: customizeButtons,
            "drawCallback": function (exhibition) {
                if (exhibition.json !== undefined) {
                    let exhibitionInformation = exhibition.json["information"]

                    let last_update = exhibition.json["last_update"];
                    let informationFullName = exhibitionInformation["fullname"]
                    let externalLink = exhibitionInformation["external_link"]
                    let googleMapPlaceId = exhibitionInformation["google_map_place_id"]
                    // let address = exhibitionInformation["address"]

                    let externalLinkEle = ""
                    if (externalLink !== undefined) {
                        externalLinkEle = `<a class="btn btn-secondary" href="${externalLink}" target="_blank"><strong><i class="bi bi-box-arrow-up-right"></i></strong></a>`;
                    }
                    if (googleMapPlaceId !== undefined) {
                        externalLinkEle = externalLinkEle + `<a style="margin-left: 10px" class="btn btn-secondary" href="https://www.google.com/maps/search/?api=1&query=${informationFullName}&query_place_id=${googleMapPlaceId}" target="_blank"><strong><i class="bi bi-pin-map"></i></strong></a>`;
                    }
                    let shareUrl = `<a style="margin-left: 10px" class="btn btn-secondary" onclick="copyUrlToClipboard('${window.location.origin}${window.location.pathname}?topic=${exhibitionInformation["code_name"]}')" target="_blank"><strong><i class="bi bi-share"></i></strong></a>`
                    externalLinkEle = externalLinkEle + shareUrl
                    let opening = ""
                    if (exhibition.json["visit"] !== undefined) {
                        opening = exhibition.json["visit"]["opening"]
                    }

                    $(".caption-card-header").html(`《${informationFullName}》${externalLinkEle}`)
                    if (opening !== undefined && opening !== "") {
                        $(".caption-card-body").html(`${opening.replaceAll('\n', '<br>')}`)
                    } else {
                        $(".caption-card-body").empty()
                    }
                    $(".caption-card-footer").html(`資料更新時間: ${formatDate(last_update)}`)
                }
            },
            createdRow: function (row, data, dataIndex) {
                if (data.systematics === "BUG") {
                    $('td:eq(0)', row).attr('colspan', 5);
                    $('td:eq(1)', row).css('display', 'none');
                    $('td:eq(3)', row).css('display', 'none');
                    $('td:eq(2)', row).css('display', 'none');
                    $('td:eq(4)', row).css('display', 'none');
                    $('td:eq(0)', row).css({"text-align": "center", "font-size": "1.5rem"})
                    $('td:eq(0)', row).addClass("table-danger")
                }

            },
            initComplete: function () {
                this.api()
                    .columns([4])
                    .every(function () {
                        let column = this;

                        // Create select element
                        let select = document.createElement('select');
                        select.add(new Option('全部顯示', value = ''));

                        column.footer().replaceChildren(select);


                        // Apply listener for user change in value
                        select.addEventListener('change', function () {
                            column
                                .search(select.value, {exact: true})
                                .draw();
                        });

                        // Add list of options
                        select.className = "form-select";
                        select.add(new Option("尚未開始"))
                        select.add(new Option("進行中"))
                        select.add(new Option("已經結束"))
                        select.add(new Option("無法判斷"))
                    });
            }

        });
    });
    $('#exhibition').on('click', '.btn-mark-achieved', function () {
        const uuid = $(this).data('uuid');
        const table = $('#exhibition').DataTable();
        const rowData = table.rows().data().toArray().find(row => row.UUID === uuid);


        if (rowData) {
            addToAchievement(rowData.title, rowData.figure, rowData.UUID);
            const rowIndex = table.rows().indexes().toArray().find(index => table.row(index).data().UUID === uuid);
            if (rowIndex !== undefined) {
                table.row(rowIndex).remove().draw();
            }
        }
    });
    const LOCALTZ = dayjs.tz.guess();
    const formatDate = (dateString) => {
        let date = dayjs(dateString);
        return `${date.fromNow()} (${date.format("YYYY-MM-DD HH:mm:ss")})`
    }

    window.addEventListener('DOMContentLoaded', () => {
        const achievements = loadAchievements();
        achievements.forEach(item => {
            addToAchievement(item.title, item.figure, item.uuid, false)
        });
    });


</script>
