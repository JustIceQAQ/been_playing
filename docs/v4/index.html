<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Been Play v4</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.10.21/css/jquery.dataTables.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/datatables.net-responsive-bs5/2.3.0/responsive.bootstrap5.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/datatables.net-buttons-bs5/2.3.6/buttons.bootstrap5.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../theme_fix.css" />

  <style>
    .venue-section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--bs-secondary-color);
      border-bottom: 1px solid var(--bs-border-color);
      padding-bottom: 4px;
      margin: 10px 0 6px;
    }
    .venue-section-label:first-child { margin-top: 4px; }

    #venueTabContent { min-height: 60px; }

    img { max-width: 300px; height: auto; image-rendering: crisp-edges; }
    td { word-wrap: break-word; }

    /* hide the original dt-buttons entirely */
    .dt-buttons { display: none !important; }
  </style>
</head>

<body>

<!-- ── Modals ── -->
<div class="modal fade" id="deleteAllAchievementModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5">刪除成就列表</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">你確定真的要刪除所有已記錄的成就?</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">返回</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteAchievements">我很確定!!</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="confirmImportModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5">確認匯入</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
      </div>
      <div class="modal-body" id="importSummaryText"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-danger" id="btnConfirmImport">確定覆蓋匯入</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Offcanvas: 成就列表 ── -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasAchievement" aria-labelledby="offcanvasAchievementLabel">
  <div class="offcanvas-header d-flex align-items-center gap-2 flex-wrap">
    <h5 class="offcanvas-title" id="offcanvasAchievementLabel">成就列表</h5>
    <button class="btn btn-success" onclick="exportAchievementsToJSON()"><i class="bi bi-cloud-download-fill"></i></button>
    <button class="btn btn-primary" onclick="document.getElementById('importAchievementsInput').click()"><i class="bi bi-cloud-upload-fill"></i></button>
    <input type="file" id="importAchievementsInput" accept=".json" style="display:none" />
    <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteAllAchievementModal"><i class="bi bi-trash"></i></button>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body" id="achievementList"></div>
</div>

<!-- ── Toast ── -->
<div class="toast align-items-center" style="position:fixed;bottom:1rem;right:1rem;z-index:1080;" id="cpToast" role="alert" aria-live="assertive" aria-atomic="true">
  <div class="d-flex">
    <div class="toast-body">分享網址已複製至剪貼簿</div>
    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
</div>

<!-- ── Main ── -->
<div class="container-fluid">

  <div class="row">
    <div class="col">
      <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
          <span class="navbar-brand fw-bold">Been Play</span>
          <div class="d-flex gap-2">
            <button class="btn btn-warning shadow" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasAchievement">
              <i class="bi bi-star-fill"></i>
            </button>
            <button class="btn shadow" id="btnSwitch">
              <i class="bi" id="themeIcon"></i>
            </button>
          </div>
        </div>
      </nav>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <table id="exhibition" class="table align-middle display responsive nowrap caption-top" style="width:100%">
        <caption>
          <div class="card text-bg-warning">
            <h5 class="card-header caption-card-header"></h5>
            <div class="card-body caption-card-body"></div>
            <div class="card-footer caption-card-footer"></div>
          </div>
        </caption>
        <thead>
          <tr>
            <th>展覽名稱</th><th>圖片</th><th>日期</th><th>地點</th><th>狀態</th><th>去過了?</th>
          </tr>
        </thead>
        <tfoot>
          <tr>
            <th>展覽名稱</th><th>圖片</th><th>日期</th><th>地點</th><th>狀態</th><th>去過了?</th>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <footer>
        <div class="card">
          <div class="card-body small text-muted">
            本網頁所有資料來源僅供 <a href="https://justiceqaq.github.io/">@JustIceQAQ</a> 作為 Side Project 技術展示用途。實際最新資訊請參閱各機構官方網站。
          </div>
        </div>
      </footer>
    </div>
  </div>

</div>

<!-- ── Scripts ── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-ajax-localstorage-cache/2.0.1/jalc.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.2.3/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.2.3/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.3.0/js/dataTables.responsive.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.13/dayjs.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.13/plugin/relativeTime.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.13/locale/zh-tw.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="./dataset.js"></script>

<script>
  // ── Badge helpers ──
  const notStartedBadges = (tag="h2") => `<${tag}><span class="badge bg-warning" style="color:#3c3d30;">尚未開始</span></${tag}>`;
  const inProgressBadges = (tag="h2") => `<${tag}><span class="badge bg-success">進行中</span></${tag}>`;
  const finishedBadges   = (tag="h2") => `<${tag}><span class="badge bg-danger">已經結束</span></${tag}>`;
  const unableBadges     = (tag="h2") => `<${tag}><span class="badge bg-secondary">無法判斷</span></${tag}>`;

  // ── Theme ──
  const setLight = () => {
    document.documentElement.setAttribute("data-bs-theme", "light");
    document.getElementById("themeIcon").className = "bi bi-sun-fill";
  };
  const setDark = () => {
    document.documentElement.setAttribute("data-bs-theme", "dark");
    document.getElementById("themeIcon").className = "bi bi-moon-stars-fill";
  };
  document.getElementById("btnSwitch").addEventListener("click", () => {
    document.documentElement.getAttribute("data-bs-theme") === "dark" ? setLight() : setDark();
  });

  // ── Date helpers ──
  dayjs.extend(window.dayjs_plugin_relativeTime);
  dayjs.locale("zh-tw");
  const formatDate = (s) => { const d = dayjs(s); return `${d.fromNow()} (${d.format("YYYY-MM-DD HH:mm:ss")})`; };

  const exhibitionStats = (dateString, tag="h2") => {
    if (!dateString) return unableBadges(tag);
    const now = dayjs(new Date().toLocaleDateString("tw-zh"));
    const parts = dateString.split("~");
    if (parts.length === 1) {
      if (parts[0] === "-" || parts[0] === "") return inProgressBadges(tag);
      const d = dayjs(parts[0].trim());
      if (isNaN(d)) return unableBadges(tag);
      return now.isAfter(d) ? finishedBadges(tag) : notStartedBadges(tag);
    }
    if (parts[1] === "") return inProgressBadges(tag);
    const start = dayjs(parts[0].trim()), end = dayjs(parts[1].trim());
    if (start.isAfter(now)) return notStartedBadges(tag);
    if (now.isAfter(end)) return finishedBadges(tag);
    return inProgressBadges(tag);
  };

  // ── Achievements ──
  const ACHIEVEMENTS_KEY = "been-been-play-achievements";
  const loadAchievements  = () => { try { return JSON.parse(localStorage.getItem(ACHIEVEMENTS_KEY)) || []; } catch { return []; } };
  const saveAchievements  = (data) => localStorage.setItem(ACHIEVEMENTS_KEY, JSON.stringify(data));

  const getAchievementElement = (title, figure) => {
    const card = document.createElement("div");
    card.className = "card mb-3"; card.style.maxWidth = "540px";
    const row = document.createElement("div"); row.className = "row g-0";
    const colImg = document.createElement("div"); colImg.className = "col-md-4";
    const img = document.createElement("img");
    img.className = "img-fluid rounded-start"; img.src = figure; img.alt = title;
    colImg.appendChild(img);
    const colText = document.createElement("div"); colText.className = "col-md-8";
    const body = document.createElement("div"); body.className = "card-body";
    const titleEl = document.createElement("h5"); titleEl.className = "card-title"; titleEl.textContent = title;
    body.appendChild(titleEl); colText.appendChild(body);
    row.appendChild(colImg); row.appendChild(colText); card.appendChild(row);
    return card;
  };

  const addToAchievement = (title, figure, uuid, is_save = true) => {
    const container = document.getElementById("achievementList");
    if (container) container.appendChild(getAchievementElement(title, figure));
    if (is_save) {
      const list = loadAchievements();
      if (!list.some(i => i.uuid === uuid)) { list.push({title, figure, uuid}); saveAchievements(list); }
    }
  };

  const exportAchievementsToJSON = () => {
    const blob = new Blob([JSON.stringify(loadAchievements(), null, 2)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "achievements_backup.json"; a.click(); URL.revokeObjectURL(a.href);
  };

  let importedAchievementsData = null;
  document.getElementById("importAchievementsInput").addEventListener("change", function (e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) return alert("格式錯誤：應為陣列！");
        if (!data.every(i => typeof i.title === "string" && typeof i.figure === "string" && typeof i.uuid === "string"))
          return alert("格式錯誤：缺少必要欄位");
        importedAchievementsData = data;
        document.getElementById("importSummaryText").innerHTML =
          `你將匯入 <strong>${data.length}</strong> 筆成就資料，這將會覆蓋現有成就。確定嗎？`;
        new bootstrap.Modal(document.getElementById("confirmImportModal")).show();
      } catch { alert("匯入失敗：JSON 格式錯誤"); }
    };
    reader.readAsText(file);
  });
  document.getElementById("btnConfirmImport").addEventListener("click", () => {
    if (importedAchievementsData) { saveAchievements(importedAchievementsData); alert("匯入成功！將重新載入頁面。"); location.reload(); }
  });
  document.getElementById("confirmDeleteAchievements").addEventListener("click", () => {
    localStorage.removeItem(ACHIEVEMENTS_KEY);
    document.getElementById("achievementList").innerHTML = "";
    bootstrap.Modal.getInstance(document.getElementById("deleteAllAchievementModal")).hide();
    bootstrap.Offcanvas.getInstance(document.getElementById("offcanvasAchievement")).hide();
    location.reload();
  });

  // ── DataTables button registration ──
  allVenues.forEach(venue => {
    $.fn.dataTable.ext.buttons[venue.topic] = {
      text: venue.name,
      action: (e, dt) => dt.ajax.url(`${URL_SOURCE}${venue.topic}.json`).load(),
    };
  });

  // ── Button CSS injection ──
  const styleEl = document.createElement("style");
  styleEl.innerHTML = allVenues.map(venue =>
    `.btn-${venue.topic}{color:${venue.c};background-color:${venue.bg};border-color:${venue.b};` +
    `--bs-btn-hover-color:${venue.c};--bs-btn-hover-bg:${venue.bg};}`
  ).join("");
  document.head.appendChild(styleEl);

  // ── Main DataTable ──
  $(document).ready(function () {
    const isDark = window.matchMedia("(prefers-color-scheme:dark)").matches;
    isDark ? setDark() : setLight();

    const initTopic = getInitTopic();
    const customizeButtons = allVenues.map(venue => ({ extend: venue.topic, className: `btn btn-${venue.topic}` }));

    $("#exhibition").DataTable({
      dom: "Bprtip",
      processing: true,
      responsive: true,
      deferRender: true,
      ajax: {
        url: `${URL_SOURCE}${initTopic}.json`,
        localCache: true,
        type: "GET",
        cacheTTL: 0.5,
        dataSrc: (d) => {
          const visited = new Set(loadAchievements().map(i => i.uuid));
          return d.items.filter(item => !visited.has(item.UUID));
        },
      },
      order: [],
      columns: [
        {
          data: "title",
          render: (data, type, row) =>
            `<a target="_blank" href="${row.source_url}"><div style="width:18rem;white-space:normal;word-break:break-all;">${data}${exhibitionStats(row.date, "h6")}</div></a>`,
        },
        {
          data: "figure",
          render: (data) => data === "-" ? "-" : `<img src="${data}" loading="lazy" />`,
        },
        { data: "date" },
        {
          data: "address",
          render: (data) =>
            `<div style="width:14rem;white-space:normal;word-break:break-all;">${data ?? "-"}</div>`,
        },
        { data: "date", render: (data) => exhibitionStats(data) },
        {
          data: "UUID",
          render: (data) => `<button class="btn btn-info btn-mark-achieved" data-uuid="${data}"><i class="bi bi-check-lg"></i></button>`,
        },
      ],
      columnDefs: [
        { targets: 0, responsivePriority: 1 },
        { targets: 1, responsivePriority: 10002 },
        { targets: 2, responsivePriority: 1 },
        { targets: 3, responsivePriority: 2 },
        { targets: 4, responsivePriority: 2 },
        { targets: 5, responsivePriority: 2 },
      ],
      buttons: customizeButtons,
      drawCallback: function (settings) {
        if (!settings.json) return;
        const info = settings.json.information;
        const last_update = settings.json.last_update;
        const coord = info.branch_coordinates;
        let gmapId = null;
        if (coord && typeof coord === "object" && !Array.isArray(coord)) gmapId = coord.google_map_place_id;
        else if (Array.isArray(coord) && coord.length) gmapId = coord[0].google_map_place_id;

        let btns = "";
        if (info.external_link) btns += `<a class="btn btn-secondary" href="${info.external_link}" target="_blank"><i class="bi bi-box-arrow-up-right"></i></a> `;
        if (gmapId) btns += `<a class="btn btn-secondary ms-1" href="https://www.google.com/maps/search/?api=1&query=${info.fullname}&query_place_id=${gmapId}" target="_blank"><i class="bi bi-pin-map"></i></a> `;
        btns += `<a class="btn btn-secondary ms-1" onclick="copyUrlToClipboard('${location.origin}${location.pathname}?topic=${info.code_name}')"><i class="bi bi-share"></i></a>`;
        if (settings.json.information.has_rss !== false)
          btns += ` <a class="btn btn-secondary ms-1" href="${SOURCE_ROOT_URL}rss/${info.code_name}.xml" target="_blank"><i class="bi bi-rss-fill"></i></a>`;
        if (settings.json.information.has_ics !== false) {
          const rawIcs = `${SOURCE_ROOT_URL}ics/${info.code_name}.ics`;
          const webCal = rawIcs.replace("https://", "webcal://");
          btns += ` <div class="btn-group ms-1"><button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"><i class="bi bi-calendar-plus"></i> 訂閱展覽時程</button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="${webCal}" target="_blank">Apple 日曆 / Outlook</a></li>
              <li><a class="dropdown-item" href="https://www.google.com/calendar/render?cid=${webCal}" target="_blank">Google 日曆</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="${rawIcs}" target="_blank">下載 .ics 檔案</a></li>
            </ul></div>`;
        }

        $(".caption-card-header").html(`《${info.fullname}》 ${btns}`);
        const opening = settings.json.visit?.opening;
        opening ? $(".caption-card-body").html(opening.replaceAll("\n", "<br>")) : $(".caption-card-body").empty();
        $(".caption-card-footer").html(`資料更新時間：${formatDate(last_update)}`);
      },
      createdRow: (row, data) => {
        if (data.systematics === "BUG") {
          $("td:eq(0)", row).attr("colspan", 5).css({ "text-align": "center", "font-size": "1.5rem" }).addClass("table-danger");
          $("td:eq(1),td:eq(2),td:eq(3),td:eq(4)", row).css("display", "none");
        }
      },
      initComplete: function () {
        // ── Column status filter ──
        this.api().columns([4]).every(function () {
          const col = this;
          const select = document.createElement("select");
          select.className = "form-select";
          select.add(new Option("全部顯示", ""));
          select.add(new Option("尚未開始"));
          select.add(new Option("進行中"));
          select.add(new Option("已經結束"));
          select.add(new Option("無法判斷"));
          col.footer().replaceChildren(select);
          select.addEventListener("change", () => col.search(select.value, { exact: true }).draw());
        });

        // ── Regional tab UI ──
        const dtButtonsDiv = document.querySelector(".dt-buttons");
        if (!dtButtonsDiv) return;

        const allBtns = Array.from(dtButtonsDiv.querySelectorAll("button"));
        const btnByTopic = {};
        allBtns.forEach(btn => {
          const topic = Array.from(btn.classList).map(c => c.replace(/^btn-/, "")).find(t => allTopicSet.has(t));
          if (topic) btnByTopic[topic] = btn;
        });

        // Find initial region
        let initRegion = venueGroups[0].region;
        outer: for (const g of venueGroups) {
          for (const sg of g.subgroups) {
            if (sg.venues.some(v => v.topic === initTopic)) { initRegion = g.region; break outer; }
          }
        }
        let activeRegion = initRegion;

        const nav     = document.createElement("ul");
        nav.className = "nav nav-tabs flex-wrap";

        const content = document.createElement("div");
        content.id    = "venueTabContent";
        content.className = "p-2 border border-top-0 rounded-bottom mb-2";

        const showRegion = (regionName) => {
          activeRegion = regionName;
          nav.querySelectorAll(".nav-link").forEach(l => l.classList.toggle("active", l.dataset.region === regionName));
          content.innerHTML = "";
          const group = venueGroups.find(g => g.region === regionName);
          if (!group) return;
          group.subgroups.forEach(sg => {
            if (sg.label) {
              const label = document.createElement("div");
              label.className = "venue-section-label";
              label.textContent = sg.label;
              content.appendChild(label);
            }
            const row = document.createElement("div");
            row.className = "d-flex flex-wrap gap-2 mb-1";
            sg.venues.forEach(v => {
              const btn = btnByTopic[v.topic];
              if (btn) { btn.style.display = ""; row.appendChild(btn); }
            });
            content.appendChild(row);
          });
        };

        venueGroups.forEach(group => {
          const count = group.subgroups.reduce((s, sg) => s + sg.venues.length, 0);
          const li = document.createElement("li"); li.className = "nav-item";
          const link = document.createElement("button");
          link.className = `nav-link${group.region === initRegion ? " active" : ""}`;
          link.dataset.region = group.region;
          link.innerHTML = `${group.region} <span class="badge bg-secondary ms-1">${count}</span>`;
          link.addEventListener("click", () => showRegion(group.region));
          li.appendChild(link); nav.appendChild(li);
        });

        // Search input
        const filterInput = document.createElement("input");
        filterInput.type = "text";
        filterInput.placeholder = "搜尋場館...";
        filterInput.className = "form-control form-control-sm mb-1";
        filterInput.style.maxWidth = "300px";

        filterInput.addEventListener("input", function () {
          const query = this.value.toLowerCase();
          if (!query) {
            nav.style.pointerEvents = ""; nav.style.opacity = "";
            showRegion(activeRegion); return;
          }
          nav.style.pointerEvents = "none"; nav.style.opacity = "0.4";
          content.innerHTML = "";
          const row = document.createElement("div"); row.className = "d-flex flex-wrap gap-2 p-1";
          Object.values(btnByTopic).forEach(btn => {
            if (btn.textContent.toLowerCase().includes(query)) { btn.style.display = ""; row.appendChild(btn); }
          });
          content.appendChild(row);
        });

        const wrapper = document.createElement("div");
        wrapper.appendChild(filterInput);
        wrapper.appendChild(nav);
        wrapper.appendChild(content);
        dtButtonsDiv.parentNode.insertBefore(wrapper, dtButtonsDiv);

        showRegion(initRegion);
      },
    });

    // ── Mark achieved ──
    $("#exhibition").on("click", ".btn-mark-achieved", function () {
      const uuid = $(this).data("uuid");
      const table = $("#exhibition").DataTable();
      const rowData = table.rows().data().toArray().find(r => r.UUID === uuid);
      if (rowData) {
        addToAchievement(rowData.title, rowData.figure, rowData.UUID);
        const idx = table.rows().indexes().toArray().find(i => table.row(i).data().UUID === uuid);
        if (idx !== undefined) table.row(idx).remove().draw();
      }
    });

    // ── Load achievements into offcanvas ──
    loadAchievements().forEach(item => addToAchievement(item.title, item.figure, item.uuid, false));
  });
</script>
</html>
