name: Test Action External Network
on:
  workflow_dispatch:
    inputs:
      targetUrl:
        description: "Target URL"
        required: true

jobs:
  run-process:
    runs-on: ubuntu-latest
    env:
      targetUrl: ${{ inputs.targetUrl }}
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Check IPs
        env:
          PROXY_POOL: ${{ secrets.PROXY_POOL }}
        run: |
          tailscale status || true
          echo "direct:"
          curl -sS --max-time 20 https://api.ipify.org || echo "FAILED"
          echo
          echo "proxied:"
          curl -sS --max-time 20 -x "$PROXY_POOL" https://api.ipify.org || echo "FAILED"

      - name: Test Exhibition URL
        run: |
          curl -v --max-time 30 "$targetUrl" || echo "FAILED"
          parsed_host=$(echo "$targetUrl" | awk -F/ '{print $3}')
          domain=$(echo "$parsed_host" | cut -d: -f1)
          port=$(echo "$parsed_host" | grep -q ':' && echo "$parsed_host" | cut -d: -f2 || echo "443")
          openssl s_client -connect "${domain}:${port}" -servername "$domain" -showcerts </dev/null

      - name: Test Exhibition URL With Proxy
        env:
          PROXY_POOL: ${{ secrets.PROXY_POOL }}
        run: |
          curl -sS --max-time 20 -x "$PROXY_POOL" \
            -o /dev/null \
            -w "HTTP %{http_code}, 總時間 %{time_total}s\n" \
            "$targetUrl" || echo "FAILED"