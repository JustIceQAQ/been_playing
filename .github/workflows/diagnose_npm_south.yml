name: diagnose

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose connectivity
        run: |
          URL="https://fam.bocach.gov.tw/News2.aspx?n=990&sms=10480"
          echo "== runner IP =="; curl -s https://api.ipify.org; echo
          echo "== default =="; curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 "$URL" || true
          echo "== tls1.2 only =="; curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 --tlsv1.2 --tls-max 1.2 "$URL" || true
          echo "== openssl =="; echo | openssl s_client -connect fam.bocach.gov.tw:443 -servername fam.bocach.gov.tw 2>&1 | head -20 || true
          openssl version