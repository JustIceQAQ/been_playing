name: update-async-some-exhibition

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: "develop"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "develop"
    paths:
      - ".github/workflows/update_async_exhibition.yml"
  push:
    branches:
      - "develop"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-process:
    runs-on: ubuntu-latest
    steps:
      - name: set timezone
        uses: szenius/set-timezone@v1.0
        with:
          timezoneLinux: "Asia/Taipei"

      - name: checkout repo content
        uses: actions/checkout@v2
        with:
          ref: "develop"


      - name: setup python 3.12 with uv
        uses: astral-sh/setup-uv@v2

      - name: create virtual environment
        run: uv venv

      - uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements.txt') }}

      - name: install dependencies with uv
        run: |
          uv pip install -r requirements.txt

      - name: run async script with uv
        run: |
          uv run python run_some_async_script.py
        env:
          IMGUR_API_CLIENT_ID: ${{ secrets.IMGUR_API_CLIENT_ID }}
          IMGUR_API_CLIENT_SECRET: ${{ secrets.IMGUR_API_CLIENT_SECRET }}
          SENTRY_SDK_DNS: ${{ secrets.SENTRY_SDK_DNS }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPE_DO_API_KEY: ${{ secrets.SCRAPE_DO_API_KEY }}
          IS_DEBUG: ${{ vars.IS_DEBUG }}
          PROXY_POOL: ${{ secrets.PROXY_POOL }}




