name: update-parallel-async-exhibition

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: "auto/data-update"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "auto/data-update"
    paths:
      - ".github/workflows/update_parallel_async_exhibition.yml"
  push:
    branches:
      - "auto/data-update"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        range:
          - { worker: 1, max-worker: 5 }
          - { worker: 2, max-worker: 5 }
          - { worker: 3, max-worker: 5 }
          - { worker: 4, max-worker: 5 }
          - { worker: 5, max-worker: 5 }

    steps:
      - name: set timezone
        uses: szenius/set-timezone@v1.0
        with:
          timezoneLinux: "Asia/Taipei"

      - name: checkout repo content
        uses: actions/checkout@v2
        with:
          ref: "auto/data-update"

      - name: setup python 3.12 with uv
        uses: astral-sh/setup-uv@v2

      - name: create virtual environment
        run: uv venv

      - uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements.txt') }}

      - name: install dependencies with uv
        run: |
          uv pip install -r requirements.txt

      - name: run async script with uv
        run: |
          uv run python run_all_async_script.py \
          --worker ${{ matrix.range.worker }} \
          --max-worker ${{ matrix.range.max-worker }}
        env:
          IMGUR_API_CLIENT_ID: ${{ secrets.IMGUR_API_CLIENT_ID }}
          IMGUR_API_CLIENT_SECRET: ${{ secrets.IMGUR_API_CLIENT_SECRET }}
          SENTRY_SDK_DNS: ${{ secrets.SENTRY_SDK_DNS }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPE_DO_API_KEY: ${{ secrets.SCRAPE_DO_API_KEY }}
          IS_DEBUG: ${{ vars.IS_DEBUG }}
      - name: Upload partial results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.range.worker }}-${{ matrix.range.max-worker }}
          path: data/*.json
  merge-results:
    runs-on: ubuntu-latest
    needs: crawl
    steps:
      - name: Download all partial results
        uses: actions/download-artifact@v4
        with:
          path: data/
      - name: Move JSON files
        run: |
          echo "Move *.json to /data/v2 and remove empty folders..."
          python - <<'EOF'
          import shutil, pathlib
          data_dir = pathlib.Path("data")
          (data_dir / "v2.1").mkdir(exist_ok=True)
          for subdir in data_dir.glob("results-*"):
              if subdir.is_dir():
                  for json_file in subdir.glob("*.json"):
                      shutil.move(str(json_file), data_dir / "v2.1" / json_file.name)
                      print(f"Moved: {json_file.name}")
                  try:
                      subdir.rmdir()
                      print(f"Removed empty folder: {subdir}")
                  except OSError:
                      print(f"Skip non-empty folder: {subdir}")
          
          print("Done moving and cleaning.")
          EOF

      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git config --local --unset-all "http.https://github.com/.extraheader"
          git add -A
          git commit -m "update data/*.json from async process" -a
      - name: push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: "auto/data-update"


